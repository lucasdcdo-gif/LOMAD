<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOMAD - Teste de UI Inicial</title>
    
    <!-- Tailwind CSS (via CDN para testes rápidos) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyan: { 400: '#22d3ee', 500: '#06b6d4' },
                        emerald: { 500: '#10b981', 600: '#059669' },
                        slate: { 300: '#cbd5e1', 400: '#94a3b8', 700: '#334155', 800: '#1e293b', 900: '#0f172a', 950: '#020617' },
                        white: '#ffffff'
                    }
                }
            }
        }
    </script>
    
    <!-- React & ReactDOM (via CDN) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel para compilar o JSX direto no navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            background-color: #020617; /* bg-slate-950 */
            color: white;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        .glass {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(12px);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // Simulação do componente de Logo
        const LomadLogo = ({ size = 48, withText = false, className = "" }) => (
            <div className={`flex items-center justify-center gap-1 ${className}`} style={{ width: size, height: size }}>
                <div style={{ width: size * 0.15, height: size * 0.4 }} className="bg-cyan-500 rounded-full animate-pulse"></div>
                <div style={{ width: size * 0.15, height: size * 0.7 }} className="bg-emerald-400 rounded-full animate-pulse" style={{ animationDelay: '0.2s' }}></div>
                <div style={{ width: size * 0.15, height: size * 0.9 }} className="bg-emerald-500 rounded-full animate-pulse" style={{ animationDelay: '0.4s' }}></div>
                <div style={{ width: size * 0.15, height: size * 0.6 }} className="bg-cyan-600 rounded-full animate-pulse" style={{ animationDelay: '0.1s' }}></div>
                <div style={{ width: size * 0.15, height: size * 0.3 }} className="bg-cyan-500 rounded-full animate-pulse" style={{ animationDelay: '0.3s' }}></div>
            </div>
        );

        // Componente Principal que replica a tela
        const AppTest = () => {
            const [view, setView] = React.useState('MAIN');
            const [isMenuOpen, setIsMenuOpen] = React.useState(false);
            
            // Simula um usuário não logado
            const user = null;

            return (
                <div className="min-h-screen w-full flex flex-col items-center">
                    {/* Header Fixo */}
                    <nav className="sticky top-0 w-full z-50 p-4 backdrop-blur-xl">
                        <div className="w-full max-w-7xl mx-auto flex items-center justify-between px-8 py-5 glass rounded-[2rem] border border-white/10 shadow-2xl relative">
                            {/* Logo Esquerda */}
                            <div className="flex items-center gap-3 cursor-pointer hover:scale-105 transition-transform" onClick={() => setView('MAIN')}>
                                <LomadLogo size={48} withText={false} />
                                <span className="font-black text-white text-2xl tracking-tight">LOMAD</span>
                            </div>
                            
                            {/* Menu Desktop */}
                            <div className="hidden md:flex items-center gap-2">
                                <button className="px-5 py-2.5 text-sm font-bold text-slate-300 hover:text-white hover:bg-white/5 rounded-xl transition-all">Preços</button>
                                <button className="px-5 py-2.5 text-sm font-bold text-slate-300 hover:text-white hover:bg-white/5 rounded-xl transition-all">Como Funciona</button>
                                <button className="px-5 py-2.5 text-sm font-bold text-slate-300 hover:text-white hover:bg-white/5 rounded-xl transition-all">Quem Somos</button>
                                <button className="px-8 py-3 bg-gradient-to-r from-cyan-500 to-emerald-500 text-white rounded-xl font-bold text-sm hover:shadow-lg hover:shadow-cyan-500/30 hover:scale-105 transition-all">Entrar</button>
                            </div>

                            {/* Botão Mobile */}
                            <div className="md:hidden flex items-center">
                                <button
                                    onClick={() => setIsMenuOpen(!isMenuOpen)}
                                    className="p-2 text-slate-300 hover:text-white transition-colors"
                                >
                                    <svg className="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        {isMenuOpen ? (
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
                                        ) : (
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" />
                                        )}
                                    </svg>
                                </button>
                            </div>

                            {/* Menu Mobile Overlay */}
                            {isMenuOpen && (
                                <div className="absolute top-full left-0 right-0 mt-4 p-6 glass rounded-[2rem] border border-white/10 shadow-2xl flex flex-col gap-4 md:hidden bg-slate-900/95 backdrop-blur-xl z-[60] max-h-[85vh] overflow-y-auto custom-scrollbar">
                                    <button className="p-4 text-left font-bold text-slate-300 hover:text-white hover:bg-white/5 rounded-xl">Preços</button>
                                    <button className="p-4 text-left font-bold text-slate-300 hover:text-white hover:bg-white/5 rounded-xl">Como Funciona</button>
                                    <button className="p-4 text-left font-bold text-slate-300 hover:text-white hover:bg-white/5 rounded-xl">Quem Somos</button>
                                    <button className="p-4 text-center font-bold text-white bg-gradient-to-r from-cyan-500 to-emerald-500 rounded-xl mt-2">Entrar</button>
                                </div>
                            )}
                        </div>
                    </nav>

                    {/* Conteúdo Principal */}
                    <main className="w-full max-w-7xl flex flex-col items-center px-6 pb-24">
                        <div className="w-full max-w-4xl flex flex-col items-center text-center space-y-20 py-16 md:py-28">
                            <div className="space-y-12">
                                {/* Gemini Badge */}
                                <div className="flex flex-col items-center gap-8">
                                    <div className="flex items-center gap-3">
                                        <div className="h-1 w-12 bg-gradient-to-r from-transparent via-cyan-500 to-transparent rounded-full"></div>
                                        <span className="text-cyan-400 text-sm font-bold uppercase tracking-widest">Powered by Gemini AI</span>
                                        <div className="h-1 w-12 bg-gradient-to-r from-transparent via-cyan-500 to-transparent rounded-full"></div>
                                    </div>

                                    {/* Logo Grande e Titulo */}
                                    <div className="flex flex-col items-center gap-6">
                                        <LomadLogo size={140} withText={true} className="opacity-90" />
                                        <h1 className="text-3xl md:text-5xl lg:text-6xl font-black tracking-tight text-white text-center">
                                            TRANSCRITOR <span className="bg-gradient-to-r from-cyan-500 via-emerald-500 to-emerald-600 bg-clip-text text-transparent italic block md:inline">UNIVERSAL</span>
                                        </h1>
                                    </div>
                                </div>

                                {/* Descrição */}
                                <p className="text-slate-300 text-lg md:text-xl font-medium max-w-2xl mx-auto leading-relaxed">
                                    Grave reuniões e obtenha transcrições precisas com inteligência artificial.
                                </p>
                                
                                {/* Features */}
                                <div className="flex items-center justify-center gap-6 pt-4">
                                    <div className="flex items-center gap-2 text-slate-400">
                                        <svg className="w-5 h-5 text-green-500" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clipRule="evenodd" /></svg>
                                        <span className="text-sm font-medium">Transcrição Inteligente</span>
                                    </div>
                                    <div className="flex items-center gap-2 text-slate-400">
                                        <svg className="w-5 h-5 text-green-500" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clipRule="evenodd" /></svg>
                                        <span className="text-sm font-medium">Chat Inteligente</span>
                                    </div>
                                </div>
                            </div>

                            {/* Bloco de Login */}
                            <div className="w-full bg-gradient-to-br from-slate-900/50 via-slate-950/50 to-slate-900/50 p-6 md:p-14 rounded-[2rem] md:rounded-[3rem] border border-white/10 glass shadow-2xl backdrop-blur-xl">
                                <div className="flex flex-col items-center gap-6">
                                    <div className="w-16 h-16 rounded-full bg-blue-500/20 flex items-center justify-center">
                                        <svg className="w-8 h-8 text-cyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                                        </svg>
                                    </div>
                                    <div className="text-center space-y-3">
                                        <h3 className="text-2xl font-black text-white">Login Necessário</h3>
                                        <p className="text-slate-400 text-base max-w-md">Para utilizar o recurso de transcrição, você precisa estar autenticado na plataforma.</p>
                                    </div>
                                    <button
                                        onClick={() => alert('Abrir modal de login!')}
                                        className="px-10 py-4 bg-gradient-to-r from-cyan-500 to-emerald-500 text-white rounded-xl font-bold text-lg hover:shadow-lg hover:shadow-cyan-500/30 hover:scale-105 transition-all"
                                    >
                                        Fazer Login
                                    </button>
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AppTest />);
    </script>
</body>
</html>
