<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOMAD - Transcrição Inteligente</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { cyan: '#06b6d4', emerald: '#10b981', blue: '#2563eb' },
            dark: { 950: '#020617', 900: '#0f172a', 800: '#1e293b' }
          },
          animation: {
            'float': 'float 6s ease-in-out infinite',
            'fade-in-up': 'fadeInUp 0.6s ease-out forwards',
            'waveform': 'waveform 1.2s ease-in-out infinite',
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          },
          keyframes: {
            float: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-20px)' } },
            fadeInUp: { '0%': { opacity: '0', transform: 'translateY(15px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
            waveform: { '0%, 100%': { height: '8px' }, '50%': { height: '28px' } }
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #020617;
      margin: 0;
      color: white;
      overflow-x: hidden;
    }

    .light-section-shadow {
      box-shadow: 0 -20px 50px rgba(0, 0, 0, 0.5);
    }

    .floating-widget-shadow {
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(0, 0, 0, 0.05);
    }

    .chat-scrollbar::-webkit-scrollbar {
      width: 4px;
    }

    .chat-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }

    .chat-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }

    .bg-mesh {
      min-height: 100vh;
      background-attachment: fixed;
      background-image: radial-gradient(at 0% 0%, hsla(210, 100%, 15%, 1) 0, transparent 50%),
        radial-gradient(at 100% 100%, hsla(260, 100%, 15%, 1) 0, transparent 50%);
      background-size: cover;
    }

    .glass {
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    @keyframes subtle-glow {

      0%,
      100% {
        box-shadow: 0 0 20px rgba(6, 182, 212, 0.1);
      }

      50% {
        box-shadow: 0 0 40px rgba(6, 182, 212, 0.2);
      }
    }

    .glow-pulse {
      animation: subtle-glow 4s ease-in-out infinite;
    }
  </style>
</head>

<body class="bg-mesh">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
